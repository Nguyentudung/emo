[workspace]
resolver = "2"
members = [
    "desktop",
    "media-core",
    "image-engine",
    "video-engine",
    "thumbnail-engine",
    "filesystem",
    "task-manager",
    "cache-engine",
    "metadata-engine",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Veyra Team"]

[workspace.dependencies]
slint = { version = "1.8", features = ["std"] }
image = "0.25"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
notify = "6.1"
lru = "0.12"
walkdir = "2.5"
chrono = "0.4"
dirs = "5.0"
rfd = "0.15"
